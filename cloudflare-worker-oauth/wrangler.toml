## wrangler CLIでこのWorkerをデプロイする場合に使う設定ファイルです。
## ダッシュボードから直接貼り付けてデプロイする場合は、このファイルは不要です
## （README.mdの「方法B」を参照してください）。

name = "decap-cms-oauth-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

## GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET はここには書きません。
## `npx wrangler secret put GITHUB_CLIENT_ID` のようにコマンドで安全に登録します。
## （README.mdの手順を参照）
