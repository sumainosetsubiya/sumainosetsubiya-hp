# ============================================================
# Decap CMS 設定ファイル（住まいの設備屋さん HP・施工実績管理）
# ============================================================
# ビルドツール（webpack/Next.js等）を使わない素のHTMLサイトのため、
# admin/index.html でCDN経由のdecap-cms本体を読み込み、この
# config.yml だけでコレクション定義を完結させています。

backend:
  name: github
  # ▼▼▼ 実際のGitHubリポジトリ作成後に、ここを書き換える ▼▼▼
  # "GitHubユーザー名/リポジトリ名" の形式（例: "yamada-taro/sumainosetsubiya-hp"）
  repo: "sumainosetsubiya/sumainosetsubiya-hp"
  branch: main
  # ▼▼▼ cloudflare-worker-oauth/ でデプロイしたWorkerの公開URLに書き換える ▼▼▼
  # 例: "https://decap-cms-oauth-proxy.your-subdomain.workers.dev"
  # これを設定しないと、Decap CMSはデフォルトのNetlify製OAuthサービスに
  # アクセスしようとしてログインできません（MIGRATION_GUIDE.md 手順7・8参照）。
  base_url: "https://decap-cms-oauth-proxy.sumainosetsubiya.workers.dev"
  auth_endpoint: auth

# サイト公開後のURL（独自ドメイン設定後に書き換える。MIGRATION_GUIDE.md 手順9参照）
site_url: "https://sumainosetsubiya.com"
display_url: "https://sumainosetsubiya.com"

# 画像をアップロードした際の保存先フォルダ（リポジトリ内のパス）と
# HTML側からアクセスする際の公開パス
media_folder: "images/works/uploads"
public_folder: "/images/works/uploads"

collections:
  - name: "works"
    label: "施工実績"
    description: "works.html に表示される施工実績カードの内容を編集します。"
    # content/works.json という単一ファイルを編集対象にする File collection。
    # ファイル内の "works" 配列を list ウィジェットで複数エントリ編集する構成。
    files:
      - name: "works"
        label: "施工実績一覧"
        file: "content/works.json"
        fields:
          - label: "施工実績"
            name: "works"
            widget: "list"
            label_singular: "施工実績"
            summary: "{{fields.category}}（{{fields.area}}）"
            fields:
              - label: "施工日"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
                required: false
                hint: "施工事例を随時更新予定などで日付が未定の場合は空欄のままでも構いません"
              - label: "施工エリア"
                name: "area"
                widget: "select"
                options:
                  - "東京都足立区"
                  - "東京都荒川区"
                  - "東京都板橋区"
                  - "東京都北区"
                  - "東京都練馬区"
                  - "埼玉県上尾市"
                  - "埼玉県朝霞市"
                  - "埼玉県桶川市"
                  - "埼玉県川口市"
                  - "埼玉県越谷市"
                  - "埼玉県さいたま市西区"
                  - "埼玉県さいたま市北区"
                  - "埼玉県さいたま市大宮区"
                  - "埼玉県さいたま市見沼区"
                  - "埼玉県さいたま市中央区"
                  - "埼玉県さいたま市桜区"
                  - "埼玉県さいたま市浦和区"
                  - "埼玉県さいたま市南区"
                  - "埼玉県さいたま市緑区"
                  - "埼玉県さいたま市岩槻区"
                  - "埼玉県志木市"
                  - "埼玉県草加市"
                  - "埼玉県戸田市"
                  - "埼玉県新座市"
                  - "埼玉県富士見市"
                  - "埼玉県ふじみ野市"
                  - "埼玉県和光市"
                  - "埼玉県蕨市"
                  - "その他"
                hint: "対応エリア一覧（area.html）に基づく選択肢です。該当がない場合は「その他」を選んでください"
              - label: "カテゴリ"
                name: "category"
                widget: "select"
                options:
                  - "トイレ交換"
                  - "温水洗浄便座交換"
                  - "蛇口交換"
                  - "ビルトイン食洗機交換"
                  - "ビルトインコンロ交換"
                  - "レンジフード交換"
                  - "IHクッキングヒーター交換"
                  - "浴室乾燥機交換"
                  - "換気扇交換"
                hint: "該当する工事カテゴリをタップして選択してください"
              - label: "メーカー"
                name: "manufacturer"
                widget: "relation"
                collection: "manufacturers"
                search_fields: ["name"]
                value_field: "name"
                display_fields: ["name"]
                hint: "入力すると候補が絞り込まれます。候補に無い新しいメーカーを使いたい場合は、先に画面左のメニューにある「メーカーマスタ」を開いて名前を1件追加・保存してください。その後この画面に戻れば候補に出てきます（一度追加すれば以降ずっと選択肢に残ります）"
              - label: "品番"
                name: "model"
                widget: "relation"
                collection: "models"
                search_fields: ["name"]
                value_field: "name"
                display_fields: ["name", "manufacturer"]
                hint: "入力すると候補が絞り込まれます。候補に無い新しい品番を使いたい場合は、先に画面左のメニューにある「品番マスタ」を開いて品番を1件追加・保存してください。その後この画面に戻れば候補に出てきます（一度追加すれば以降ずっと選択肢に残ります）"
              - label: "作業時間"
                name: "duration"
                widget: "select"
                options:
                  - "30分"
                  - "1時間"
                  - "1.5時間"
                  - "2時間"
                  - "2.5時間"
                  - "3時間"
                  - "3.5時間"
                  - "4時間"
                  - "その他"
                hint: "「約」は付けずに選択してください（表示側で自動的に「約」が付きます）"
              - label: "施工前の写真"
                name: "before_image"
                widget: "image"
                choose_url: false
              - label: "施工後の写真"
                name: "after_image"
                widget: "image"
                choose_url: false
              - label: "一言コメント"
                name: "note"
                widget: "text"
                required: false
                hint: "任意項目です。空欄でも構いません"

  # ------------------------------------------------------------
  # メーカー・品番マスタ（施工実績フォームの「メーカー」「品番」の
  # 選択肢の元データ）。folder collection にして1件＝1ファイルにする
  # ことで、Decap CMSの relation ウィジェットから検索・選択できる
  # ようにしている。運用イメージ:
  #   1. 施工実績の「メーカー」「品番」欄で、使いたい名称が候補に
  #      出てこない場合は、まずこの「メーカーマスタ」「品番マスタ」
  #      メニューで「New メーカー」等から1件追加して保存する
  #   2. 施工実績フォームに戻ると、追加した名称が検索候補に出るように
  #      なるので、それを選択する
  # 一度追加すれば、以降のすべての施工実績エントリで再利用できる。
  # ------------------------------------------------------------
  - name: "manufacturers"
    label: "メーカーマスタ"
    description: "「施工実績」フォームの「メーカー」欄の選択肢です。新しいメーカーを使いたいときは、ここに1件追加してから施工実績フォームに戻ってください。"
    folder: "content/manufacturers"
    create: true
    slug: "{{fields.name}}"
    format: "json"
    summary: "{{fields.name}}"
    fields:
      - label: "メーカー名"
        name: "name"
        widget: "string"
        hint: "例: Panasonic、TOTO、LIXIL など"

  - name: "models"
    label: "品番マスタ"
    description: "「施工実績」フォームの「品番」欄の選択肢です。新しい品番を使いたいときは、ここに1件追加してから施工実績フォームに戻ってください。"
    folder: "content/models"
    create: true
    slug: "{{fields.name}}"
    format: "json"
    summary: "{{fields.name}}（{{fields.manufacturer}}）"
    fields:
      - label: "品番"
        name: "name"
        widget: "string"
        hint: "例: NP-45MS9S"
      - label: "メーカー（任意・参考表示用）"
        name: "manufacturer"
        widget: "string"
        required: false
        hint: "この品番がどのメーカーのものか分かる場合は入力してください（任意項目）"
