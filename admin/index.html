<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>コンテンツ管理画面｜住まいの設備屋さん</title>
  <!-- このページがDecap CMSの管理画面本体です。依頼主はここにログインして
       施工実績（works）の追加・編集を行います。ロジックは全てCDN経由の
       decap-cms本体スクリプトと、同じフォルダの config.yml（admin/config.yml）
       で完結し、ビルドステップは一切不要です。 -->
</head>
<body>
  <!-- config.yml はこのファイルと同じ admin/ フォルダから自動的に読み込まれます -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // ============================================================
    // カスタムウィジェット「mobile-image」
    // ------------------------------------------------------------
    // 標準の image ウィジェットは「Choose an image」を押すと
    // Decap CMSのメディアライブラリのモーダル画面が開き、その中の
    // 「Upload」を押してようやくスマホの写真選択が開く、という
    // 2段階の操作が必要になる。スマホで撮った施工写真をサッと
    // アップロードしたいだけの依頼主にはこれが手間だったため、
    // タップ1回で直接スマホの写真選択（<input type="file">）が
    // 開くようにしたウィジェット。
    //
    // 画像の実際のアップロード（gitへのコミット対象への登録）は、
    // Decap CMSの内部APIである onPersistMedia(file, opts) を呼ぶ
    // ことで、標準ウィジェットと全く同じ仕組み（persistMedia →
    // 下書きの mediaFiles に登録 → 「公開する」を押した時に他の
    // 変更とまとめてコミットされる）に正しく乗せている。
    // 保存先フォルダは config.yml の media_folder /
    // public_folder の設定がそのまま使われる。
    // ============================================================
    var MobileImageControl = createClass({
      getInitialState: function () {
        return { assetUrl: null, uploading: false };
      },

      componentDidMount: function () {
        this.updateAsset();
      },

      componentDidUpdate: function (prevProps) {
        if (prevProps.value !== this.props.value) {
          this.updateAsset();
        }
      },

      // プレビュー用のURLを解決する。getAsset は Decap CMS が
      // 標準の image/file ウィジェットでも使っている仕組みで、
      // まだ公開（コミット）されていない下書き画像であっても
      // ブラウザ内のキャッシュから表示できる場合はそちらを返す。
      updateAsset: function () {
        var value = this.props.value;
        if (!value) {
          this.setState({ assetUrl: null });
          return;
        }
        try {
          var asset = this.props.getAsset(value, this.props.field);
          this.setState({ assetUrl: asset ? String(asset) : null });
        } catch (err) {
          this.setState({ assetUrl: null });
        }
      },

      // config.get('public_folder') のように Immutable の Map として
      // 読めるバージョンと、プレーンなJSオブジェクトとして渡される
      // バージョンの両方に対応しておく（Decap CMSのバージョンによって
      // 内部実装が変わる可能性があるための保険）。
      readConfigValue: function (config, key) {
        if (!config) return undefined;
        if (typeof config.get === 'function') return config.get(key);
        return config[key];
      },

      handleFileChange: function (e) {
        var file = e.target.files && e.target.files[0];
        // 同じファイルを選び直した時にも onChange イベントが
        // 発火するよう、値をリセットしておく
        e.target.value = '';
        if (!file) return;

        var self = this;
        this.setState({ uploading: true });

        this.props
          .onPersistMedia(file, { field: this.props.field })
          .then(function (result) {
            var mediaFile = result && result.payload ? result.payload : result;
            var fileName = mediaFile && mediaFile.name;
            if (!fileName) {
              throw new Error('アップロード結果からファイル名を取得できませんでした');
            }
            var publicFolder = self.readConfigValue(self.props.config, 'public_folder') || '';
            publicFolder = publicFolder.replace(/\/+$/, '');
            var publicPath = publicFolder + '/' + fileName;
            self.props.onChange(publicPath);
            self.setState({ uploading: false });
          })
          .catch(function (err) {
            console.error('画像のアップロードに失敗しました', err);
            self.setState({ uploading: false });
            window.alert('画像のアップロードに失敗しました。もう一度お試しください。');
          });
      },

      handleRemove: function (e) {
        e.preventDefault();
        this.props.onChange('');
      },

      render: function () {
        var forID = this.props.forID;
        var classNameWrapper = this.props.classNameWrapper;
        var state = this.state;
        var children = [];

        if (state.assetUrl) {
          children.push(
            h('img', {
              key: 'preview',
              src: state.assetUrl,
              style: {
                display: 'block',
                maxWidth: '240px',
                maxHeight: '240px',
                objectFit: 'contain',
                marginBottom: '10px',
                border: '1px solid #ddd',
                borderRadius: '4px',
                backgroundColor: '#f4f4f4',
              },
            })
          );
        }

        // <label> で <input type="file"> を包むことで、ラベル部分を
        // タップした瞬間に（モーダル等を挟まず）ネイティブの
        // 写真選択が直接開く。input 自体は視覚的に隠す。
        children.push(
          h(
            'label',
            {
              key: 'label',
              htmlFor: forID,
              style: {
                display: 'inline-block',
                padding: '12px 20px',
                marginRight: '10px',
                backgroundColor: state.uploading ? '#9aa5b1' : '#3a7ca5',
                color: '#fff',
                borderRadius: '4px',
                cursor: state.uploading ? 'default' : 'pointer',
                fontSize: '15px',
                fontWeight: 'bold',
              },
            },
            state.uploading ? 'アップロード中…' : state.assetUrl ? '写真を変更する' : '写真を選択する'
          )
        );

        children.push(
          h('input', {
            key: 'input',
            id: forID,
            type: 'file',
            accept: 'image/*',
            onChange: this.handleFileChange,
            disabled: state.uploading,
            style: {
              position: 'absolute',
              width: '1px',
              height: '1px',
              padding: 0,
              margin: '-1px',
              overflow: 'hidden',
              clip: 'rect(0,0,0,0)',
              whiteSpace: 'nowrap',
              border: 0,
            },
          })
        );

        if (state.assetUrl && !state.uploading) {
          children.push(
            h(
              'button',
              {
                key: 'remove',
                type: 'button',
                onClick: this.handleRemove,
                style: {
                  padding: '12px 16px',
                  backgroundColor: '#c0392b',
                  color: '#fff',
                  border: 'none',
                  borderRadius: '4px',
                  cursor: 'pointer',
                  fontSize: '15px',
                },
              },
              '削除'
            )
          );
        }

        return h('div', { className: classNameWrapper, style: { position: 'relative' } }, children);
      },
    });

    // プレビューペイン（右側のプレビュー表示）用。値があれば同じ
    // getAsset の仕組みでサムネイルを表示する。
    var MobileImagePreview = createClass({
      render: function () {
        var value = this.props.value;
        var field = this.props.field;
        var getAsset = this.props.getAsset;
        if (!value || !getAsset) return null;
        var asset = getAsset(value, field);
        if (!asset) return null;
        return h('img', {
          src: String(asset),
          style: { maxWidth: '100%' },
        });
      },
    });

    CMS.registerWidget('mobile-image', MobileImageControl, MobileImagePreview);

    // ============================================================
    // カスタムウィジェット「suggest-input」
    // ------------------------------------------------------------
    // メーカー・品番の入力欄。以下を1つの欄で満たす:
    //   1. 過去に使った値が候補として出る（タップで選ぶだけ）
    //   2. 候補に無い値はその場で直接入力できる
    //      （マスタ画面へ移動して先に登録する必要がない）
    //   3. 品番は、選択中の「カテゴリ」「メーカー」に合うものだけに絞る
    //
    // 【候補をどこから集めるか】
    // マスタ（content/models, content/manufacturers）に加えて、
    // **既存の施工実績そのもの**からも集める。施工実績には
    // （品番・メーカー・カテゴリ）が必ず揃っているため、
    // 一度その場で入力して公開すれば、次回から候補に出るようになる。
    // つまりマスタを手入力で育てる必要がない。
    // マスタは「まだ施工実績が無い商品を先回りで登録しておく」用途として残す。
    //
    // 【他の項目の値をDOMから読んでいる理由】
    // Decap CMS 3.16 がウィジェットに渡す props を実機で全て確認したが、
    // 入力中の下書きの値を持つものが1つも無かった。props.entry は存在する
    // ものの中身は「保存済みの内容」で、新規作成時は最後まで空のまま
    // （強制的に再描画させても空であることを実機で確認済み）。
    // そのため、同じフォーム内に描画されている入力欄のDOMから直接読む。
    // 入力欄には項目名に基づく id（例: category-field-3）が振られるので
    // 前方一致で特定できる。
    //
    // 【安全側に倒している点】
    //  1. 値が読めなかった場合は「絞り込まない」側に倒す
    //  2. マスタ側の分類が空欄のものは「どれにでも該当」として常に残す
    //  3. 保存済みの値が絞り込み条件に合わなくても消さず、先頭に残す
    //  4. 「すべてから選ぶ」で絞り込みを解除できる
    //  5. 候補が0件でも直接入力できるので、入力が詰むことがない
    //
    // 【config.yml での指定】
    //   widget: "suggest-input"
    //   collection: "models"        # マスタ（任意）
    //   learn_from: "works"         # 候補を学習する元のコレクション
    //   learn_field: "model"        # そのコレクション内の項目名
    //   filter_by: ["category", "manufacturer"]   # 同フォームの項目で絞る
    //   item_label: "品番"          # 画面表示に使う名称
    // ============================================================
    var SuggestInputControl = createClass({
      getInitialState: function () {
        return {
          items: [],
          loading: true,
          showAll: false,
          freeMode: false,
          error: null,
          siblings: {}
        };
      },

      componentDidMount: function () {
        this.loadItems();
        this.syncSiblings();
        // 他の項目が変わったことを知る手段が props から得られないため、
        // 短い間隔で読み直す。読むのはDOM数箇所だけなので負荷は無視できる。
        this.siblingTimer = setInterval(this.syncSiblings, 400);
      },

      componentWillUnmount: function () {
        if (this.siblingTimer) {
          clearInterval(this.siblingTimer);
          this.siblingTimer = null;
        }
      },

      /* ---------- config.yml の読み取り ---------- */

      cfg: function (key, fallback) {
        try {
          var field = this.props.field;
          if (field && typeof field.get === 'function') {
            var v = field.get(key);
            if (v === null || v === undefined) return fallback;
            if (typeof v.toJS === 'function') return v.toJS();
            return v;
          }
        } catch (e) {}
        return fallback;
      },

      filterFields: function () {
        var v = this.cfg('filter_by', []);
        return Array.isArray(v) ? v : [];
      },

      itemLabel: function () {
        return this.cfg('item_label', '値');
      },

      /* ---------- 同じフォーム内の他項目を読む ---------- */

      // 戻り値: 文字列（空文字＝未選択）／ null＝読み取れなかった
      readSiblingFromDom: function (name) {
        try {
          var el = document.querySelector('[id^="' + name + '-field"]');
          if (!el) return null;
          // react-select（select / relation ウィジェット）の場合
          var control = el.closest('div[class*="control"], div[class*="Control"]');
          if (control) {
            var single = control.querySelector('[class*="ingleValue"]');
            if (single) return String(single.textContent || '').trim();
          }
          // このウィジェット自身のような素の input / select の場合
          if (el.tagName === 'SELECT' || el.tagName === 'INPUT') {
            return String(el.value || '').trim();
          }
          return control ? '' : null;
        } catch (e) {
          return null;
        }
      },

      readSiblingFromEntry: function (name) {
        try {
          var entry = this.props.entry;
          if (entry && typeof entry.getIn === 'function') {
            var v = entry.getIn(['data', name]);
            if (v !== null && v !== undefined) return String(v);
          }
        } catch (e) {}
        return null;
      },

      resolveSibling: function (name) {
        var v = this.readSiblingFromDom(name);
        if (v !== null) return v;
        v = this.readSiblingFromEntry(name);
        if (v !== null) return v;
        return ''; // 読めなければ絞り込まない
      },

      syncSiblings: function () {
        var self = this;
        var names = this.filterFields();
        if (!names.length) return;
        var next = {};
        var changed = false;
        names.forEach(function (n) {
          next[n] = self.resolveSibling(n);
          if (next[n] !== self.state.siblings[n]) changed = true;
        });
        if (changed) this.setState({ siblings: next });
      },

      /* ---------- 候補の読み込み ---------- */

      loadItems: function () {
        var self = this;
        var masterCollection = this.cfg('collection', null);
        var learnFrom = this.cfg('learn_from', null);
        var learnField = this.cfg('learn_field', null);
        var filterFields = this.filterFields();

        if (typeof this.props.query !== 'function') {
          this.setState({ loading: false, error: '候補を読み込めませんでした（直接入力はできます）' });
          return;
        }

        var jobs = [];

        // (1) マスタから
        if (masterCollection) {
          jobs.push(
            this.props.query(this.props.forID, masterCollection, ['name'], '').then(function (res) {
              var hits = (res && res.payload && res.payload.hits) || [];
              return hits.map(function (hit) {
                var d = (hit && hit.data) || {};
                var rec = { name: String(d.name || '').trim(), source: 'master' };
                filterFields.forEach(function (f) { rec[f] = String(d[f] || '').trim(); });
                return rec;
              });
            }).catch(function () { return []; })
          );
        }

        // (2) 既存の施工実績から学習
        if (learnFrom && learnField) {
          jobs.push(
            this.props.query(this.props.forID, learnFrom, [learnField], '').then(function (res) {
              var hits = (res && res.payload && res.payload.hits) || [];
              return hits.map(function (hit) {
                var d = (hit && hit.data) || {};
                var rec = { name: String(d[learnField] || '').trim(), source: 'works' };
                filterFields.forEach(function (f) { rec[f] = String(d[f] || '').trim(); });
                return rec;
              });
            }).catch(function () { return []; })
          );
        }

        if (!jobs.length) {
          this.setState({ loading: false, items: [] });
          return;
        }

        Promise.all(jobs)
          .then(function (lists) {
            var merged = {};
            lists.forEach(function (list) {
              list.forEach(function (rec) {
                if (!rec.name) return;
                var prev = merged[rec.name];
                if (!prev) {
                  merged[rec.name] = rec;
                  return;
                }
                // 同じ名前が複数から来た場合、空欄を埋める方向でまとめる
                filterFields.forEach(function (f) {
                  if (!prev[f] && rec[f]) prev[f] = rec[f];
                });
              });
            });
            var out = Object.keys(merged).map(function (k) { return merged[k]; });
            out.sort(function (a, b) { return a.name.localeCompare(b.name, 'ja'); });
            self.setState({ items: out, loading: false });
          })
          .catch(function () {
            self.setState({ loading: false, error: '候補の読み込みに失敗しました（直接入力はできます）' });
          });
      },

      /* ---------- 絞り込み ---------- */

      matches: function (item) {
        var self = this;
        var names = this.filterFields();
        for (var i = 0; i < names.length; i++) {
          var n = names[i];
          var selected = self.state.siblings[n] || '';
          var own = item[n] || '';
          // 選択されていない、または候補側が空欄なら「該当する」扱い
          if (selected && own && own !== selected) return false;
        }
        return true;
      },

      /* ---------- 操作 ---------- */

      handleSelectChange: function (e) {
        var v = e.target.value;
        if (v === '__FREE__') {
          this.setState({ freeMode: true });
          return;
        }
        this.props.onChange(v || '');
      },

      handleFreeInput: function (e) {
        this.props.onChange(e.target.value || '');
      },

      backToList: function () {
        this.setState({ freeMode: false });
      },

      toggleShowAll: function (e) {
        this.setState({ showAll: !!e.target.checked });
      },

      /* ---------- 表示 ---------- */

      render: function () {
        var self = this;
        var value = this.props.value || '';
        var label = this.itemLabel();
        var names = this.filterFields();

        var inputStyle = {
          width: '100%',
          padding: '12px',
          // iOSで入力時に画面が自動ズームしないよう16px以上にする
          fontSize: '16px',
          borderRadius: '4px',
          border: '1px solid #dfdfe3',
          background: '#fff'
        };
        var noteStyle = { margin: '6px 0 0', fontSize: '12px', color: '#7a7a8c' };
        var linkStyle = {
          display: 'inline-block',
          marginTop: '8px',
          fontSize: '13px',
          color: '#3a69c7',
          background: 'none',
          border: 'none',
          padding: 0,
          cursor: 'pointer',
          textDecoration: 'underline'
        };

        if (this.state.loading) {
          return h('div', { className: this.props.classNameWrapper }, '候補を読み込んでいます…');
        }

        // ---- 直接入力モード ----
        if (this.state.freeMode) {
          return h(
            'div',
            { className: this.props.classNameWrapper },
            h('input', {
              id: this.props.forID,
              type: 'text',
              value: value,
              onChange: this.handleFreeInput,
              placeholder: label + 'を入力してください',
              style: inputStyle
            }),
            h('button', { type: 'button', onClick: this.backToList, style: linkStyle }, '← 一覧から選ぶ'),
            h(
              'p',
              { style: noteStyle },
              'ここで入力した' + label + 'は、公開後は自動的に次回以降の候補に出るようになります（マスタへの登録は不要です）。'
            )
          );
        }

        // ---- 一覧から選ぶモード ----
        var visible = this.state.showAll
          ? this.state.items
          : this.state.items.filter(function (i) { return self.matches(i); });

        var valueMissing = value && !visible.some(function (i) { return i.name === value; });

        var options = [h('option', { key: '__empty', value: '' }, '— 選択してください —')];
        if (valueMissing) {
          options.push(h('option', { key: '__current', value: value }, value + '（現在の値）'));
        }
        visible.forEach(function (i) {
          var text = i.name;
          var extra = names
            .map(function (n) { return i[n]; })
            .filter(Boolean)
            .join(' / ');
          if (extra) text += '（' + extra + '）';
          options.push(h('option', { key: i.name, value: i.name }, text));
        });
        options.push(
          h('option', { key: '__free', value: '__FREE__' }, '＋ 一覧に無い' + label + 'を直接入力する')
        );

        var notes = [];
        var selectedFilters = names
          .map(function (n) { return self.state.siblings[n]; })
          .filter(Boolean);

        if (names.length && !selectedFilters.length) {
          notes.push('（全 ' + this.state.items.length + ' 件）先に上の項目を選ぶと候補が絞り込まれます。');
        } else if (names.length && !this.state.showAll) {
          notes.push(
            '絞り込み中：' + selectedFilters.join(' × ') +
            '（該当 ' + visible.length + ' 件 / 全 ' + this.state.items.length + ' 件）'
          );
          if (visible.length === 0) {
            notes.push('該当する' + label + 'がありません。「＋ 一覧に無い' + label + 'を直接入力する」からそのまま入力できます。');
          }
        } else if (!names.length) {
          notes.push('（全 ' + this.state.items.length + ' 件）候補に無い場合は「＋ 一覧に無い' + label + 'を直接入力する」を選んでください。');
        }
        if (valueMissing && !this.state.showAll) {
          notes.push('※現在入っている値は絞り込み条件に一致していません（値はそのまま保持しています）。');
        }
        if (this.state.error) notes.push(this.state.error);

        var children = [
          h(
            'select',
            {
              id: this.props.forID,
              value: value,
              onChange: this.handleSelectChange,
              style: inputStyle
            },
            options
          )
        ];

        if (names.length) {
          children.push(
            h(
              'label',
              {
                style: {
                  display: 'block',
                  marginTop: '8px',
                  fontSize: '13px',
                  color: '#5d5d6b',
                  cursor: 'pointer'
                }
              },
              h('input', {
                type: 'checkbox',
                checked: this.state.showAll,
                onChange: this.toggleShowAll,
                style: { marginRight: '6px' }
              }),
              'すべての' + label + 'から選ぶ（絞り込みを解除）'
            )
          );
        }

        notes.forEach(function (t, i) {
          children.push(h('p', { key: 'n' + i, style: noteStyle }, t));
        });

        return h('div', { className: this.props.classNameWrapper }, children);
      }
    });

    var SuggestInputPreview = createClass({
      render: function () {
        return h('span', null, this.props.value || '');
      }
    });

    CMS.registerWidget('suggest-input', SuggestInputControl, SuggestInputPreview);
    // 旧名。config.yml と index.html の反映タイミングがずれても壊れないよう別名でも登録しておく。
    CMS.registerWidget('filtered-model', SuggestInputControl, SuggestInputPreview);

    // ============================================================
    // フォーム最下部への「公開する」複製ボタン
    // ------------------------------------------------------------
    // 依頼主から「画面上部の公開ボタンを押そうとして誤操作しやすい」
    // という要望があったため、フォームの最後（一言コメント欄の直後）
    // にも同じ動作をするボタンを複製する。
    //
    // Decap CMSの編集画面ツールバーの「公開する」ボタンは、実際には
    // ドロップダウンの開閉トリガーになっており、押すと現れる
    // メニュー項目（「Publish now」等）が本当のクリックハンドラを
    // 持っている。そのため、複製ボタンは (1) 本物のトリガーボタンを
    // 見つけてクリックし、(2) 少し待ってメニュー項目が現れたら
    // それもクリックする、という2段階の操作を自動で行うプロキシと
    // して実装している。
    //
    // ボタンの特定は、Decap CMS内部の見た目用クラス名
    // （emotionライブラリが生成する、コンポーネント名に由来する
    // 識別子を含むクラス名）をキーに行っている。これはDecap CMSの
    // 公開APIではなく内部実装の詳細であるため、将来のバージョン
    // アップで変わる可能性がある。もし将来動かなくなった場合でも、
    // 画面上部の元々のボタンは影響を受けず、通常通り使用できる。
    // ============================================================
    (function () {
      var PROXY_ID = 'mobile-publish-proxy-button';

      function findByToken(token) {
        var all = document.querySelectorAll('button, [role="button"]');
        for (var i = 0; i < all.length; i++) {
          var tokens = (all[i].className || '').toString().split(/[\s-]+/);
          if (tokens.indexOf(token) !== -1) return all[i];
        }
        return null;
      }

      function fireClick(el) {
        ['mousedown', 'mouseup', 'click'].forEach(function (type) {
          el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window }));
        });
      }

      function handleProxyClick(e) {
        e.preventDefault();
        e.stopPropagation();
        // 少し遅延させてから実行する。この複製ボタン自身への
        // 本物のクリックイベントは、このハンドラの実行後も
        // documentまでバブリングし続ける。もし遅延なしで本物の
        // 公開ボタンを同期的にクリックしてメニューを開くと、
        // その直後にこの複製ボタンのクリックイベントがdocumentまで
        // 届いた際に「メニュー外側のクリック」と誤認識されて
        // 開いたばかりのメニューが即座に閉じてしまう。setTimeoutで
        // 次のタスクに回すことでこれを回避している。
        setTimeout(function () {
          // 編集ワークフロー（publish_mode: editorial_workflow）が
          // 有効な場合の「Save」ボタン。このプロジェクトでは未使用
          // だが、将来設定が変わっても動くように一応対応しておく。
          var saveBtn = findByToken('SaveButton');
          if (saveBtn && !saveBtn.disabled) {
            fireClick(saveBtn);
            return;
          }

          // 通常モードの「Publish」ドロップダウン
          var publishBtn = findByToken('PublishButton');
          if (publishBtn) {
            fireClick(publishBtn);
            var attempts = 0;
            var maxAttempts = 15; // 50ms間隔で最大約750ms待つ
            var poll = setInterval(function () {
              attempts++;
              var item = document.querySelector('[role="menuitem"]');
              if (item) {
                clearInterval(poll);
                fireClick(item);
              } else if (attempts >= maxAttempts) {
                clearInterval(poll);
                window.alert('公開メニューを開けませんでした。お手数ですが画面上部のボタンから操作してください。');
              }
            }, 50);
            return;
          }

          // 変更なし（すでに公開済み）の場合は押せる対象がない
          window.alert('現在保存できる変更がありません（既に公開済みです）。');
        }, 0);
      }

      // フィールド一覧を囲む「ControlPaneContainer」を探す。
      // プレビューペイン側にも同名のクラスが付くことがあるため、
      // "PreviewPaneContainer" を含まないものだけを対象にする。
      function findControlPane() {
        var all = document.querySelectorAll('div');
        for (var i = 0; i < all.length; i++) {
          var tokens = (all[i].className || '').toString().split(/[\s-]+/);
          if (tokens.indexOf('ControlPaneContainer') !== -1 && tokens.indexOf('PreviewPaneContainer') === -1) {
            return all[i];
          }
        }
        return null;
      }

      // 本物のボタンの現在の見た目（背景色・文字色・角丸など）を
      // そのまま複製ボタンにコピーし、状態（公開可能/公開済み等）
      // が変わるたびに見た目も追従するようにする。
      function syncStyleFrom(sourceEl, targetEl) {
        var cs = window.getComputedStyle(sourceEl);
        [
          'backgroundColor',
          'color',
          'fontFamily',
          'fontSize',
          'fontWeight',
          'borderRadius',
          'paddingTop',
          'paddingBottom',
          'paddingLeft',
          'paddingRight',
          'border',
          'boxShadow',
          'lineHeight',
        ].forEach(function (prop) {
          targetEl.style[prop] = cs[prop];
        });
      }

      function ensureProxyButton() {
        var pane = findControlPane();
        if (!pane) return;

        var btn = document.getElementById(PROXY_ID);
        if (!btn) {
          btn = document.createElement('button');
          btn.id = PROXY_ID;
          btn.type = 'button';
          btn.textContent = 'この内容を保存・公開する';
          btn.style.display = 'block';
          btn.style.width = '100%';
          btn.style.marginTop = '28px';
          btn.style.marginBottom = '24px';
          btn.style.padding = '18px';
          btn.style.fontSize = '16px';
          btn.style.fontWeight = 'bold';
          btn.style.border = 'none';
          btn.style.borderRadius = '4px';
          btn.style.backgroundColor = '#0e4bcf';
          btn.style.color = '#fff';
          btn.addEventListener('click', handleProxyClick);
        }

        // 常にフォームの最後尾（一言コメント欄の直後）に来るようにする
        if (pane.lastElementChild !== btn) {
          pane.appendChild(btn);
        }

        var saveBtn = findByToken('SaveButton');
        var publishBtn = findByToken('PublishButton');
        var canAct = (saveBtn && !saveBtn.disabled) || !!publishBtn;
        btn.disabled = !canAct;
        btn.style.opacity = canAct ? '1' : '0.5';
        btn.style.cursor = canAct ? 'pointer' : 'default';

        var refBtn = saveBtn || publishBtn || findByToken('PublishedButton') || findByToken('PublishedToolbarButton');
        if (refBtn) syncStyleFrom(refBtn, btn);
      }

      // 画面内のDOM変化（エントリ編集画面の表示・フィールドの
      // 増減・公開状態の切り替わり等）を監視し、そのたびにボタンの
      // 位置と見た目を同期する。rAFでまとめることで、連続した
      // 変化があっても同期処理が過剰に走らないようにしている。
      var scheduled = false;
      function scheduleSync() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(function () {
          scheduled = false;
          ensureProxyButton();
        });
      }

      var observer = new MutationObserver(scheduleSync);
      observer.observe(document.body, { childList: true, subtree: true });
      ensureProxyButton();
    })();
  </script>
</body>
</html>
